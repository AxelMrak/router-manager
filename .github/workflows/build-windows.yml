name: Build Windows Installer

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build executable with PyInstaller
      run: |
        $iconArg = if (Test-Path "assets/icon.ico") { "--icon=assets/icon.ico" } else { "" }
        pyinstaller --name="Router Manager" `
          --windowed `
          --onefile `
          $iconArg `
          --add-data="assets;assets" `
          --hidden-import=PySide6.QtCore `
          --hidden-import=PySide6.QtGui `
          --hidden-import=PySide6.QtWidgets `
          main.py
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: RouterManager-Windows
        path: dist/Router Manager.exe
    
    - name: Upload to release
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: dist/Router Manager.exe
        asset_name: RouterManager-Windows.exe
        asset_content_type: application/octet-stream
