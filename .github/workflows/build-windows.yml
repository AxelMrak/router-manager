name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.2)"
        required: true
        type: string
      changelog:
        description: "Release notes"
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build executable with PyInstaller
      shell: pwsh
      run: |
        $args = @(
          "--name=RouterManager"
          "--windowed"
          "--onefile"
          "--add-data=assets;assets"
          "--hidden-import=PySide6.QtCore"
          "--hidden-import=PySide6.QtGui"
          "--hidden-import=PySide6.QtWidgets"
          "main.py"
        )
        if (Test-Path "assets/icon.ico") {
          $args = @("--icon=assets/icon.ico") + $args
        }
        pyinstaller @args

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: RouterManager-Windows
        path: dist/RouterManager.exe

    - name: Upload executable to release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="${{ inputs.version }}"
        NOTES="${{ inputs.changelog }}"

        # Delete existing release/tag if present (from a previous failed run)
        gh release delete "$TAG" --yes 2>/dev/null || true

        # Create release (also creates the tag) and upload in one command
        gh release create "$TAG" \
          --title "$TAG" \
          --notes "${NOTES:-Build $TAG}" \
          --target "${{ github.sha }}" \
          dist/RouterManager.exe
